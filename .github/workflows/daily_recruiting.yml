name: Daily Recruiting Load

on:
  workflow_call:
    inputs:
      called:
        description: "Служебный флаг: workflow вызван из оркестратора daily_all.yml. Вручную не задавать."
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      full_backfill:
        description: "Full backfill (ignore incremental window)?"
        type: boolean
        required: false
        default: false

concurrency:
  # Ручной запуск сериализуется общей группой: refresh_token у Dodo IS одноразовый и
  # ротируется при каждом обновлении, два параллельных обновления сожгут токен друг
  # другу (см. блокировку в token_store.py). Вызов из оркестратора идёт
  # в уникальной группе — сериализация там обеспечена цепочкой needs, а попытка взять
  # ту же группу, которую держит вызывающий прогон, привела бы к взаимоблокировке.
  group: ${{ inputs.called && format('dodo-is-api-call-{0}', github.run_id) || 'dodo-is-api' }}
  cancel-in-progress: false

jobs:
  load-recruiting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install_deps
        run: pip install -r requirements.txt

      - name: Run recruiting script
        id: run_script
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DATABASE: ${{ secrets.SUPABASE_DATABASE }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          USE_CLOUD_DB: "true"
        run: |
          if [ "${{ github.event.inputs.full_backfill }}" = "true" ]; then
            echo "Full backfill"
            python get_recruiting.py
          else
            SINCE=$(TZ=Asia/Yakutsk date -d "3 days ago" +%Y-%m-%dT00:00:00)
            echo "Incremental since $SINCE"
            python get_recruiting.py --modified-since "$SINCE"
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAILED_STEP="unknown"
          [ "${{ steps.checkout.outcome }}" = "failure" ] && FAILED_STEP="Checkout repository"
          [ "${{ steps.setup_python.outcome }}" = "failure" ] && FAILED_STEP="Set up Python"
          [ "${{ steps.install_deps.outcome }}" = "failure" ] && FAILED_STEP="Install dependencies"
          [ "${{ steps.run_script.outcome }}" = "failure" ] && FAILED_STEP="Run recruiting script"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="⚠️ Daily Recruiting Load упал на шаге «${FAILED_STEP}»
          ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

  load-recruiting-stage-history:
    needs: load-recruiting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install_deps
        run: pip install -r requirements.txt

      - name: Run stage history script
        id: run_script
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DATABASE: ${{ secrets.SUPABASE_DATABASE }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          USE_CLOUD_DB: "true"
        run: |
          if [ "${{ github.event.inputs.full_backfill }}" = "true" ]; then
            echo "Full backfill"
            python get_recruiting_stage_history.py
          else
            SINCE=$(TZ=Asia/Yakutsk date -d "3 days ago" +%Y-%m-%dT00:00:00)
            echo "Incremental since $SINCE"
            python get_recruiting_stage_history.py --modified-since "$SINCE"
          fi

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAILED_STEP="unknown"
          [ "${{ steps.checkout.outcome }}" = "failure" ] && FAILED_STEP="Checkout repository"
          [ "${{ steps.setup_python.outcome }}" = "failure" ] && FAILED_STEP="Set up Python"
          [ "${{ steps.install_deps.outcome }}" = "failure" ] && FAILED_STEP="Install dependencies"
          [ "${{ steps.run_script.outcome }}" = "failure" ] && FAILED_STEP="Run stage history script"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="⚠️ Daily Recruiting Load (stage history) упал на шаге «${FAILED_STEP}»
          ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"
